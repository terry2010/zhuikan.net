# /data1/conf/nginx/conf.d/zhuikan.net.conf
# zhuikan.net 官网 + news-update.zhuikan.net 更新端点
# 证书（certbot webroot，一张证书覆盖三个域）：
#   certbot certonly --webroot -w /data1/webroot -d zhuikan.net -d www.zhuikan.net -d news-update.zhuikan.net
# 放配置前先签证书（443 块引用的 pem 不存在 nginx -t 会挂）；
# 或先把下方两个 443 server 块注释掉，签完再放开 reload。

server {
    listen 80;
    server_name zhuikan.net www.zhuikan.net news-update.zhuikan.net;

    location /.well-known/acme-challenge/ { root /var/www/webroot; }

    location / { return 301 https://$host$request_uri; }
}

# 官网静态站：host /data1/htdocs/zhuikan.net（git clone）→ 容器内 /var/www/html/zhuikan.net/public
# root 指到 public/ 子目录，server/ 与 .git 不暴露
server {
    listen 443 ssl;
    server_name zhuikan.net www.zhuikan.net;

    ssl_certificate     /data1/certs/zhuikan.net/fullchain.pem;
    ssl_certificate_key /data1/certs/zhuikan.net/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/zhuikan.net/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # www 统一回主域
    if ($host = www.zhuikan.net) { return 301 https://zhuikan.net$request_uri; }

    location / { try_files $uri $uri/ =404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# 更新检查端点 → 同 webnet 的 zhuikan-update 容器（见 README docker run）
server {
    listen 443 ssl;
    server_name news-update.zhuikan.net;

    ssl_certificate     /data1/certs/zhuikan.net/fullchain.pem;
    ssl_certificate_key /data1/certs/zhuikan.net/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;

    location / {
        proxy_pass http://zhuikan-update:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
